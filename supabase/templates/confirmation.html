<!doctype html>
<!--
  New-account confirmation. Same reasoning as magic_link.html: the code is the
  only path, because the app verifies it with verifyOtp({ type: "signup" }) while
  the user is still sitting on the signup screen with the session pending.
-->
<html lang="en">
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #f6f6f4;
      font-family:
        -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif;
      color: #1b1b18;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="max-width: 440px; margin: 0 auto"
    >
      <tr>
        <td
          style="background: #ffffff; border: 1px solid #e6e4df; border-radius: 12px; padding: 32px"
        >
          <p style="margin: 0 0 4px; font-size: 20px; font-weight: 700; letter-spacing: -0.01em">
            Ordo
          </p>
          <p style="margin: 0 0 24px; font-size: 14px; color: #6b6a63">Discipline, measured.</p>

          <p style="margin: 0 0 8px; font-size: 15px">Confirm your email with this code:</p>

          <p
            style="
              margin: 0 0 24px;
              font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
              font-size: 34px;
              font-weight: 700;
              letter-spacing: 0.18em;
              color: #1b1b18;
            "
          >
            {{ .Token }}
          </p>

          <p style="margin: 0 0 8px; font-size: 14px; color: #4b4a44">
            Type it into the screen you just came from and your account is live. It expires in an
            hour.
          </p>
          <p style="margin: 0; font-size: 13px; color: #8a8880">
            If you did not sign up for Ordo, ignore this email — the account stays unconfirmed and
            unusable.
          </p>
        </td>
      </tr>
      <tr>
        <td style="padding: 16px 8px 0; font-size: 12px; color: #a3a19a">
          Sent to {{ .Email }} by Ordo.
        </td>
      </tr>
    </table>
  </body>
</html>
